version: '3.8'

services:
  svc1:
    build:
      context: ./service1
      dockerfile: Dockerfile
    container_name: svc1
    # image: joy7140/svc1:v1.0.1
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - SVC2_URL=http://svc2:8000
    networks:
      - svc-network

  svc2:
    build:
      context: ./service2
      dockerfile: Dockerfile
    container_name: svc2
    # image: joy7140/svc2:v1.0.1
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    networks:
      - svc-network

networks:
  svc-network:
    driver: bridge
