# service1
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-service1-service
spec:
  rules:
  - host: api.loadbalancer.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: service1-service
            port:
              number: 80
  ingressClassName: nginx
