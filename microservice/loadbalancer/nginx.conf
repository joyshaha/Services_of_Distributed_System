## Web-server
server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    # Trailing slashes strip the API prefix before forwarding to each service.
    location /api/service1/ {
        proxy_pass http://svc1:3000/;
    }

    location /api/service2/ {
        proxy_pass http://svc2:8000/;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
