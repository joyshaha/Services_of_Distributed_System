<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Nginx - API Call</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            text-align: center;
            padding: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #f9f9f9;
            min-height: 50px;
        }
    </style>
</head>
<body>

    <h1>Simple API Call Example</h1>
    <p>Click the button below to add 10 and 20 using the microservices.</p>
    
    <button id="fetch-btn-1">Fetch Service1</button>
    <button id="fetch-btn-2">Fetch Service2</button>

    <div id="result">
        <p style="color: #666;">Data will appear here...</p>
    </div>

    <script>
        async function callService(path) {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = 'Loading...';

            try {
                // The browser calls Nginx; Nginx resolves Docker service names.
                const response = await fetch(path, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ a: 10, b: 20 }),
                });
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                resultDiv.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                console.error('Error fetching data:', error);
                resultDiv.textContent = `Error: ${error.message}`;
            }
        }

        document.getElementById('fetch-btn-1').addEventListener('click', () => {
            callService('/api/service1/service-calling');
        });
        document.getElementById('fetch-btn-2').addEventListener('click', () => {
            callService('/api/service2/add');
        });
    </script>

</body>
</html>
