apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
        # Define the container for the nginx deployment
        - name: nginx
          image: nginx:alpine

          ports:
            - containerPort: 80
        # Define a sidecar container that runs alongside the nginx container
        # - name: sidecar
        #   image: busybox
        #   command: ["sh", "-c", "while true; do echo Hello from the sidecar container; sleep 5; done"]  

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service

spec:
  selector:
    app: nginx

  ports:
    - protocol: TCP 
      port: 80
      targetPort: 80

  type: ClusterIP
  # type: LoadBalancer
  # type: NodePort